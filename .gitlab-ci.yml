stages:
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

build_and_publish_x:
  stage: build
  image: docker:24

  services:
    - docker:24-dind

  before_script:
    - docker login ghcr.io -u "$GH_USERNAME" -p "$GH_PAT"

  script:
    - docker buildx create --use
    - docker buildx inspect --bootstrap

    - docker buildx build \
      --platform linux/amd64,linux/arm64 \
      --build-arg DATABASE_URL="$DATABASE_URL" \
      -f Dockerfile.prod \
      -t ghcr.io/imjustnon/comcamp37-server-x:latest \
      -t ghcr.io/imjustnon/comcamp37-server-x:$CI_COMMIT_SHA \
      --push .

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'